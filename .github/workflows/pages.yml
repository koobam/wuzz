name: Deploy web apps

# Builds the backoffice and the POS and uploads them to Cloudflare Pages, where they
# are served at admin-stg.wuzz.care and pos-stg.wuzz.care.
#
#   By hand   Actions > Deploy web apps > Run workflow
#   On push   to develop when one of the apps changed, but only if the repository
#             variable PAGES_AUTO_DEPLOY is "true". Off by default.
#
# Repository secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID. The Pages projects themselves already exist.
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "apps/backoffice/**"
      - "apps/pos/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  deploy:
    concurrency:
      group: pages-${{ matrix.app }}
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: backoffice, project: wuzz-admin-stg }
          - { app: pos, project: wuzz-pos-stg }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        run: pnpm --filter @wuzz/${{ matrix.app }} build
        env:
          # The apps' .env files are not in git; the staging values are set here.
          VITE_API_URL: https://api-stg.wuzz.care
          VITE_SUPPORT_URL: https://api-stg.wuzz.care/support
      - name: Upload to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy "apps/${{ matrix.app }}/dist" --project-name "${{ matrix.project }}" --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
